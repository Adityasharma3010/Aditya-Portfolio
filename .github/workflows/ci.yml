name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://adityasharma.site

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: node scripts/smoke.mjs
