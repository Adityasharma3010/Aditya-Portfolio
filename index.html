    <!-- set skin (default / cyber) and mode (dark / light) before first paint so there is no flash -->
    <script>
      (function () {
        try {
          var skin = localStorage.getItem("skin");
          var mode = localStorage.getItem("mode");
          var legacy = localStorage.getItem("theme"); // older builds stored one value
          if (!skin && legacy === "cyber") skin = "cyber";
          if (!mode && (legacy === "dark" || legacy === "light")) mode = legacy;
          if (mode !== "dark" && mode !== "light")
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          var root = document.documentElement;
          root.setAttribute("data-skin", skin === "cyber" ? "cyber" : "default");
          root.setAttribute("data-theme", mode);
          var motion = localStorage.getItem("motion");
          if (motion !== "reduced" && motion !== "full")
            motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full";
          root.setAttribute("data-motion", motion);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
